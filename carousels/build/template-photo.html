<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts/local.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  #slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); color: var(--fg); }
  .sans { --head: 'Inter Display', 'Inter', sans-serif; --track: -0.045em; --lead: .98; }
  .serif { --head: 'Cormorant Garamond', serif; --track: -0.01em; --lead: .96; }
  .abs { position: absolute; }
  .logo { left: 84px; top: 72px; height: var(--logo-h); width: auto; max-width: 420px; z-index: 5; }
  .count { right: 84px; top: 84px; font: 600 26px/1 Montserrat, sans-serif; letter-spacing: 3px; opacity: .75; z-index: 5; }
  .head { font-family: var(--head); font-weight: 800; letter-spacing: var(--track); line-height: var(--lead); }
  .serif .head { font-weight: 700; }
  .caps { font: 500 44px/1.12 Montserrat, sans-serif; text-transform: uppercase; letter-spacing: .5px; }
  .mid { display: flex; flex-direction: column; justify-content: center; }
  .caps svg { width: 44px; height: 44px; flex: none; }
  .caps b { color: var(--accent); font-weight: 800; }
  .hl { color: var(--accent); }
  .swipe { right: 84px; bottom: 70px; display: flex; align-items: center; gap: 12px; font: 600 30px/1 Montserrat, sans-serif; letter-spacing: 1px; text-transform: uppercase; z-index: 5; }
  .swipe svg { width: 46px; height: 46px; }
  .handle { left: 84px; bottom: 74px; font: 600 26px/1 Montserrat, sans-serif; letter-spacing: .5px; opacity: .8; z-index: 5; }
  .sticker { position: absolute; display: block; object-fit: contain; z-index: 3; filter: drop-shadow(0 18px 30px rgba(0,0,0,.25)); }
  .tag { display: inline-flex; align-items: center; gap: 14px; padding: 16px 30px; border-radius: 60px; background: var(--accent); color: var(--tag-ink);
    font: 800 28px/1 Montserrat, sans-serif; letter-spacing: 3px; text-transform: uppercase; }
  .tag svg { width: 34px; height: 34px; }
  .big-num { font-family: var(--head); font-weight: 800; font-size: 300px; line-height: .8; letter-spacing: -0.06em; color: var(--accent); opacity: .18; }
</style>
</head>
<body>
<div id="slide"></div>
<script>
const ICON = {
  arrow: '<circle cx="24" cy="24" r="20"/><path d="M14 24h19M26 16l8 8-8 8"/>',
  check: '<circle cx="24" cy="24" r="19"/><path d="M15 24.5l6 6 12-13"/>',
  bookmark: '<path d="M13 6h22v36l-11-8-11 8z"/>',
};
const svg = (n, c, w = 3.5) => `<svg viewBox="0 0 48 48" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

// Highlight the closing sentence, like the accent line in the reference post.
function highlight(text) {
  const parts = text.split(/(?<=[.?!])\s+(?=[A-Z“])/);
  if (parts.length < 2 || /[“”]/.test(text)) return text;
  const last = parts.pop();
  return `${parts.join(' ')} <span class="hl">${last}</span>`;
}

function fit(el, max, min, limitH) {
  let s = max;
  el.style.fontSize = s + 'px';
  while (s > min && el.offsetHeight > limitH) { s -= 2; el.style.fontSize = s + 'px'; }
  return { s, over: el.offsetHeight > limitH };
}

window.render = async ({ brand: b, slides, index, handle, format, photo, sticker, closer, focus = '50% 15%', scheme = 'a', teaser: tz, theme }) => {
  const k = b.bold;
  const el = document.getElementById('slide');
  const serif = /Cormorant/.test(b.headFont);
  const n = index + 1, total = slides.length;
  const text = slides[index];
  const darkSlide = scheme === 'b' ? n % 2 === 0 : n % 2 === 1;
  const fg = darkSlide ? '#FFFFFF' : k.lightInk;
  const accent = darkSlide ? k.accent : k.lightAccent;
  let vars = { bg: darkSlide ? k.strong : k.light, fg, accent, 'tag-ink': darkSlide ? k.strong : '#FFFFFF' };
  let logoSrc = `../assets/logos/${b.logo}${darkSlide ? '-white' : ''}.png`;
  // A per-slide theme (plain-background mode) overrides the light/dark scheme.
  if (theme) {
    vars = { bg: theme.bg, fg: theme.fg, accent: theme.accent, 'tag-ink': theme.tagInk };
    logoSrc = `../assets/logos/${b.logo}${theme.whiteLogo ? '-white' : ''}.png`;
  }
  for (const [key, v] of Object.entries(vars)) el.style.setProperty('--' + key, v);
  el.className = serif ? 'serif' : 'sans';
  el.style.setProperty('--logo-h', Math.round(b.logoHeight * 0.9) + 'px');
  const count = `<div class="abs count">${String(n).padStart(2, '0')} / ${String(total).padStart(2, '0')}</div>`;
  const swipe = `<div class="abs swipe" style="${n === 1 && format === 'sticker' && !darkSlide ? 'left:84px;right:auto' : ''}">Swipe ${svg('arrow', vars.fg)}</div>`;
  const handleEl = `<div class="abs handle">${handle}</div>`;
  const t2 = tz || k.teaser;
  const teaser = `<div class="caps">${t2[0]} <b>${t2[1]}</b></div>`;
  let html = '', fitArgs;

  if (n === 1 && format === 'plain') {
    html = `<div class="abs" style="right:-260px;bottom:-260px;width:760px;height:760px;border-radius:50%;border:3px solid ${vars.accent};opacity:.55"></div>
      <div class="abs" style="right:-140px;bottom:-140px;width:520px;height:520px;border-radius:50%;background:${vars.accent};opacity:.16"></div>
      <img class="abs logo" src="${logoSrc}">
      <div class="abs" style="left:84px;top:200px;width:912px">
        <div style="width:140px;height:12px;border-radius:6px;background:${vars.accent};margin-bottom:56px"></div>
        <div class="head" id="t">${text}</div>
      </div>
      <div class="abs" style="left:84px;bottom:170px;width:520px">${teaser}</div>
      ${handleEl}${swipe}`;
    fitArgs = [serif ? 140 : 132, 64, 640];
  } else if (n === 1 && format === 'sticker') {
    html = `<img class="abs logo" src="${logoSrc}">
      <div class="abs head" id="t" style="left:84px;top:180px;width:912px">${text}</div>
      <img class="sticker" id="st" src="../assets/people/${sticker}" style="${darkSlide ? 'left' : 'right'}:-20px;bottom:-6px;width:720px;height:800px;object-position:${darkSlide ? 'left' : 'right'} bottom">
      <div class="abs" id="side" style="${darkSlide ? 'right' : 'left'}:84px;width:300px;bottom:330px;text-align:left">${teaser}</div>
      ${swipe}`;
    fitArgs = [serif ? 120 : 108, 60, 360];
  } else if (n === 1) {
    html = `<img class="abs" src="../assets/people/${photo}" style="inset:0;width:100%;height:100%;object-fit:cover;object-position:${focus}">
      <div class="abs" style="inset:0;background:linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 38%, ${k.strong}E6 66%, ${k.strong} 100%)"></div>
      <img class="abs logo" src="../assets/logos/${b.logo}-white.png">
      <div class="abs" style="left:84px;right:84px;bottom:170px">
        <div style="margin-bottom:28px">${teaser}</div>
        <div class="head" id="t">${text}</div>
      </div>
      ${handleEl}${swipe}`;
    fitArgs = [serif ? 118 : 104, 60, 470];
  } else if (n === 4) {
    html = `<img class="abs logo" src="${logoSrc}">${count}
      <div class="abs big-num" style="right:60px;top:150px">04</div>
      <div class="abs mid" style="left:84px;right:84px;top:240px;bottom:170px">
        <div><div class="tag">${svg('check', vars['tag-ink'], 4.5)}${b.labels[3]}</div>
        <div class="head" id="t" style="margin-top:56px">${highlight(text)}</div></div>
      </div>
      ${handleEl}${swipe}`;
    fitArgs = [serif ? 92 : 80, 44, 720];
  } else if (n === total) {
    html = `<img class="abs logo" src="${logoSrc}">${count}
      <div class="abs ${closer ? '' : 'mid'}" style="left:84px;right:84px;top:220px;${closer ? '' : 'bottom:260px'}"><div>
        <div class="tag">${b.labels[4]}</div>
        <div class="head" id="t" style="margin-top:48px">${highlight(text)}</div>
      </div></div>
      ${closer ? `<img class="sticker" src="../assets/people/${closer}" style="right:-20px;bottom:-6px;width:600px;height:660px;object-position:right bottom">` : ''}
      <div class="abs" style="left:84px;bottom:150px;width:420px">
        <div class="caps" style="font-size:34px;display:flex;align-items:center;gap:16px">${svg('bookmark', vars.accent, 4)}<span>Save this<br><b>for later</b></span></div>
      </div>
      ${handleEl}`;
    fitArgs = closer ? [serif ? 96 : 84, 48, 420] : [serif ? 104 : 92, 48, 620];
  } else {
    html = `<img class="abs logo" src="${logoSrc}">${count}
      <div class="abs big-num" style="right:60px;top:150px">0${n}</div>
      <div class="abs mid" style="left:84px;right:84px;top:240px;bottom:170px"><div>
        <div class="caps" style="font-size:30px;font-weight:700;letter-spacing:4px;color:${vars.accent};margin-bottom:40px">${b.labels[n - 1]}</div>
        <div class="head" id="t">${highlight(text)}</div>
      </div></div>
      ${handleEl}${swipe}`;
    fitArgs = [serif ? 104 : 92, 48, 760];
  }
  el.innerHTML = html;
  await Promise.all([...el.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  await document.fonts.ready;
  const res = fit(document.getElementById('t'), ...fitArgs);
  return { size: res.s, overflow: res.over };
};
</script>
</body>
</html>
