<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/fonts/local.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  #slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: Montserrat, sans-serif; }
  .abs { position: absolute; }
  .logo { left: 84px; top: 70px; height: 84px; width: auto; z-index: 5; }
  .count { right: 84px; top: 100px; font-weight: 600; font-size: 26px; letter-spacing: 3px; opacity: .75; }
  .content { left: 84px; right: 84px; top: 220px; bottom: 200px; display: flex; flex-direction: column; justify-content: center; }
  .head { font-weight: 800; letter-spacing: -0.015em; line-height: 1.1; }
  .bar { width: 120px; height: 10px; border-radius: 5px; background: var(--accent); margin-bottom: 44px; }
  .body p { font-weight: 500; line-height: 1.38; color: var(--muted); }
  .body p + p { margin-top: .7em; }
  .body p.key { color: var(--accent); font-weight: 700; }
  .list { margin-top: 40px; display: flex; flex-direction: column; gap: .55em; }
  .list div { display: flex; gap: 22px; align-items: baseline; font-weight: 600; line-height: 1.3; }
  .list div::before { content: ""; flex: none; width: .5em; height: .5em; border-radius: 50%; background: var(--accent); transform: translateY(-.08em); }
  .handle { left: 84px; bottom: 74px; font-weight: 600; font-size: 26px; opacity: .8; }
  .swipe { right: 84px; bottom: 66px; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 28px;
    letter-spacing: 2px; text-transform: uppercase; }
  .swipe svg { width: 46px; height: 46px; }
  .ring { border-radius: 50%; pointer-events: none; }
  .sign { display: flex; align-items: center; gap: 28px; margin-top: 56px; padding-top: 40px; border-top: 2px solid var(--rule); }
  .sign img { height: 96px; width: auto; }
  .sign i { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 40px; color: var(--accent); }
  .ask { margin-top: 44px; background: var(--accent); color: var(--ask-ink); border-radius: 28px; padding: 34px 40px;
    font-weight: 800; font-size: 38px; line-height: 1.25; display: flex; gap: 22px; align-items: center; }
  .ask svg { width: 56px; height: 56px; flex: none; }
</style>
</head>
<body>
<div id="slide"></div>
<script>
const ICON = {
  arrow: '<circle cx="24" cy="24" r="20"/><path d="M14 24h19M26 16l8 8-8 8"/>',
  chat: '<path d="M8 10h32a4 4 0 0 1 4 4v18a4 4 0 0 1-4 4H22l-10 8v-8H8a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4z"/>',
};
const svg = (n, c, w = 3.5) => `<svg viewBox="0 0 48 48" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

// Scale headline and body together until the content block fits.
function fitBlock(box, head, others, hMax, bMax, minScale) {
  let k = 1;
  const apply = () => {
    head.style.fontSize = Math.round(hMax * k) + 'px';
    others.forEach(o => { o.style.fontSize = Math.round(bMax * k) + 'px'; });
  };
  apply();
  while (k > minScale && (box.scrollHeight > box.clientHeight + 1 || head.scrollWidth > head.clientWidth + 1)) { k -= 0.02; apply(); }
  return box.scrollHeight > box.clientHeight + 1;
}

window.render = async ({ slide: s, index, total, handle, theme, logo }) => {
  const el = document.getElementById('slide');
  for (const [k, v] of Object.entries({ bg: theme.bg, fg: theme.fg, accent: theme.accent, muted: theme.muted,
    rule: theme.rule, 'ask-ink': theme.askInk })) el.style.setProperty('--' + k, v);
  const n = index + 1;
  const logoSrc = `../assets/logos/${logo}${theme.logo === 'white' ? '-white' : ''}.png`;
  const paras = (s.body || []).map(t => t.startsWith('!') ? `<p class="key">${t.slice(1)}</p>` : `<p>${t}</p>`).join('');
  const list = s.list ? `<div class="list" id="l">${s.list.map(t => `<div>${t}</div>`).join('')}</div>` : '';
  const listFirst = !!s.list;
  // Soft rings echo the circle behind the SheEarns mark.
  const rings = `<div class="abs ring" style="right:-240px;bottom:-240px;width:680px;height:680px;border:3px solid ${theme.accent};opacity:.35"></div>
    <div class="abs ring" style="right:-120px;bottom:-120px;width:440px;height:440px;background:${theme.accent};opacity:.12"></div>`;
  let inner;
  if (n === 1) {
    inner = `<div class="bar"></div><div class="head" id="h">${s.head}</div>
      <div class="body" id="b" style="margin-top:44px">${paras}</div>`;
  } else if (s.signoff) {
    inner = `<div class="bar"></div><div class="head" id="h">${s.head}</div>
      <div class="body" id="b" style="margin-top:36px">${paras}</div>
      <div class="sign"><img src="../assets/logos/${logo}${theme.logo === 'white' ? '-white' : ''}.png"><i>${s.signoff.tagline}</i></div>
      <div class="ask" id="q">${svg('chat', theme.askInk, 3.5)}<span>${s.question}</span></div>`;
  } else {
    inner = `<div class="bar"></div><div class="head" id="h">${s.head}</div>
      ${listFirst ? list : ''}
      <div class="body" id="b" style="margin-top:${listFirst ? 40 : 40}px">${paras}</div>`;
  }
  const count = `<div class="abs count">${String(n).padStart(2, '0')} / ${String(total).padStart(2, '0')}</div>`;
  el.innerHTML = `${n === 1 || s.signoff ? rings : ''}
    ${s.signoff ? '' : `<img class="abs logo" src="${logoSrc}">`}${n === 1 ? '' : count}
    <div class="abs content" id="box" style="${s.signoff ? 'top:120px' : ''}"><div>${inner}</div></div>
    <div class="abs handle">${handle}</div>
    ${n < total ? `<div class="abs swipe">${n === 1 ? 'Swipe' : 'Next'} ${svg('arrow', theme.fg)}</div>` : ''}`;
  await Promise.all([...el.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  await document.fonts.ready;
  const box = document.getElementById('box'), head = document.getElementById('h');
  const others = [...el.querySelectorAll('#b, #l')];
  const sizes = n === 1 ? [104, 44] : s.signoff ? [78, 40] : [76, 40];
  const over = fitBlock(box, head, others, sizes[0], sizes[1], 0.6);
  return { overflow: over };
};
</script>
</body>
</html>
